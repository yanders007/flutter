# ============================================================
# Anderson CVE — GitHub Actions CI/CD
# Builds a signed release APK on every push to main and on
# version tags (v*.*.*). Artifacts are uploaded for download.
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   KEYSTORE_BASE64   — base64-encoded .jks keystore file
#   KEY_STORE_PASSWORD
#   KEY_ALIAS
#   KEY_PASSWORD
#   NIST_NVD_API_KEY  — (optional) for higher NVD rate limits
# ============================================================

name: Build & Release APK

on:
  push:
    branches: [ main, develop ]
    tags:     [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.22.2'
  JAVA_VERSION: '17'

jobs:
  # ── Job 1: Lint & Unit Tests ──────────────────────────────
  test:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --coverage

  # ── Job 2: Build Debug APK (PRs + feature branches) ──────
  build_debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug --build-number=${{ github.run_number }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: anderson-cve-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # ── Job 3: Build Release APK (main + tags) ────────────────
  build_release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Decode keystore from base64 secret
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

      # Write key.properties consumed by build.gradle
      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      # Inject optional NIST API key as a Dart define
      - name: Build release APK
        env:
          NIST_NVD_API_KEY: ${{ secrets.NIST_NVD_API_KEY }}
        run: |
          flutter build apk \
            --release \
            --build-number=${{ github.run_number }} \
            --dart-define=NIST_NVD_API_KEY=${NIST_NVD_API_KEY:-""} \
            --split-per-abi

      # Also build an app bundle for Play Store
      - name: Build release App Bundle
        run: |
          flutter build appbundle \
            --release \
            --build-number=${{ github.run_number }}

      - name: Upload release APKs (split ABI)
        uses: actions/upload-artifact@v4
        with:
          name: anderson-cve-release-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: anderson-cve-bundle-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # ── Job 4: GitHub Release (tags only) ─────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build_release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: anderson-cve-release-${{ github.sha }}
          path: ./release-apks

      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: anderson-cve-bundle-${{ github.sha }}
          path: ./release-bundle

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "$TAG" | head -1)
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" | head -20)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG..$TAG")
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Anderson CVE ${{ github.ref_name }}"
          body: |
            ## Anderson CVE ${{ github.ref_name }}

            ### What's new
            ${{ steps.changelog.outputs.CHANGELOG }}

            ### Downloads
            | File | Architecture |
            |------|-------------|
            | `app-arm64-v8a-release.apk` | ARM64 (most modern phones) |
            | `app-armeabi-v7a-release.apk` | ARM 32-bit |
            | `app-x86_64-release.apk` | x86_64 (emulators) |
            | `app-release.aab` | Android App Bundle (Play Store) |

            ### Privacy
            This app operates in **Zero-Trust Storage** mode.
            No scan data is ever written to device storage.
          files: |
            ./release-apks/*.apk
            ./release-bundle/*.aab
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
