# ============================================================
# Anderson CVE — GitHub Actions CI/CD
# Builds a signed release APK on every push to main and on
# version tags (v*.*.*). Artifacts are uploaded for download.
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   KEYSTORE_BASE64      — base64-encoded .jks keystore file
#   KEY_STORE_PASSWORD   — keystore password
#   KEY_ALIAS            — key alias inside the keystore
#   KEY_PASSWORD         — key password
#   NIST_NVD_API_KEY     — (optional) higher NVD rate limits
# ============================================================

name: Build & Release APK

on:
  push:
    branches: [ main, develop ]
    tags:     [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.22.2'
  JAVA_VERSION: '17'

jobs:
  # ── Job 1: Lint & Unit Tests ─────────────────────────────
  test:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Download real gradle-wrapper.jar
        run: |
          mkdir -p android/gradle/wrapper
          curl -fsSL \
            "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
            -o android/gradle/wrapper/gradle-wrapper.jar \
            || wget -q \
            "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
            -O android/gradle/wrapper/gradle-wrapper.jar
          echo "gradle-wrapper.jar size: $(wc -c < android/gradle/wrapper/gradle-wrapper.jar) bytes"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/
        continue-on-error: true

      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Run tests
        run: flutter test

  # ── Job 2: Build Debug APK (PRs + feature branches) ─────
  build_debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Download gradle-wrapper.jar
        run: |
          curl -fsSL \
            "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
            -o android/gradle/wrapper/gradle-wrapper.jar

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$(which flutter | sed 's|/bin/flutter||')" >> android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: |
          flutter build apk \
            --debug \
            --build-number=${{ github.run_number }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: anderson-cve-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # ── Job 3: Build Release APK (main + tags) ───────────────
  build_release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Download gradle-wrapper.jar
        run: |
          curl -fsSL \
            "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
            -o android/gradle/wrapper/gradle-wrapper.jar

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          FLUTTER_PATH=$(dirname $(which flutter))
          echo "flutter.sdk=${FLUTTER_PATH%/bin}" >> android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      - name: Build release APK (split ABI)
        env:
          NIST_NVD_API_KEY: ${{ secrets.NIST_NVD_API_KEY }}
        run: |
          flutter build apk \
            --release \
            --build-number=${{ github.run_number }} \
            --dart-define=NIST_NVD_API_KEY=${NIST_NVD_API_KEY:-""} \
            --split-per-abi

      - name: Build App Bundle (Play Store)
        run: |
          flutter build appbundle \
            --release \
            --build-number=${{ github.run_number }}

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: anderson-cve-release-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: anderson-cve-bundle-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # ── Job 4: GitHub Release (tags only) ────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build_release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release APKs
        uses: actions/download-artifact@v4
        with:
          name: anderson-cve-release-${{ github.sha }}
          path: ./release-apks

      - name: Download App Bundle
        uses: actions/download-artifact@v4
        with:
          name: anderson-cve-bundle-${{ github.sha }}
          path: ./release-bundle

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" | head -20)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..${TAG}")
          fi
          {
            echo "CHANGELOG<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Anderson CVE ${{ github.ref_name }}"
          body: |
            ## Anderson CVE ${{ github.ref_name }}

            ### Changements
            ${{ steps.changelog.outputs.CHANGELOG }}

            ### Téléchargements
            | Fichier | Architecture |
            |---------|-------------|
            | `app-arm64-v8a-release.apk` | ARM64 — téléphones modernes (recommandé) |
            | `app-armeabi-v7a-release.apk` | ARM 32-bit — anciens appareils |
            | `app-x86_64-release.apk` | x86_64 — émulateurs |
            | `app-release.aab` | App Bundle — Play Store |

            ### Confidentialité
            Mode **Zero-Trust Storage** — aucune donnée de scan n'est écrite sur l'appareil.
          files: |
            ./release-apks/*.apk
            ./release-bundle/*.aab
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
